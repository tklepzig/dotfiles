# Generated into ~/.dotfiles/delta.theme.gitconfig by set-theme, pulled in via
# include.path from ~/.gitconfig. Values MUST be quoted: an unquoted # starts a
# git-config comment and the hex would be silently dropped.
[delta]
    dark = true
    minus-style = "syntax #66161a"
    minus-emph-style = "syntax #b3383f"
    plus-style = "syntax #16512c"
    plus-emph-style = "syntax #2f8f4e"
    # non-emph inherits from the above, empty-line-marker does not
    minus-empty-line-marker-style = "normal #66161a"
    plus-empty-line-marker-style = "normal #16512c"
    line-numbers-minus-style = "bold #ff7b72"
    line-numbers-plus-style = "bold #7ee787"
    line-numbers-zero-style = "#545d68"
